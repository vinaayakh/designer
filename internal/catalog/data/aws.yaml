# AWS Cloud Catalog, v1 (ticket 017).
# Entry: id, name (full official name), kind, icon (key into the downloaded icon set; null → generic),
# hipaa (on AWS's HIPAA Eligible Services list), docs, aliases.
# TODO before release: hipaa flags were written from memory and are UNVERIFIED (hipaa_as_of is null
# until checked against https://aws.amazon.com/compliance/hipaa-eligible-services-reference/).
# Icon keys are filled in by the icon-sync script once the icon download is built.
provider: aws
display: AWS
group_names: { network: VPC, account: AWS account, zone: Availability Zone }
hipaa_as_of: null
icon_set: null

services:
