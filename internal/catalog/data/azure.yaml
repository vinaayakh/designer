  - { id: azure.data-lake-storage, name: Azure Data Lake Storage, kind: data.object, hipaa: true, aliases: [adls, data lake] }
  - { id: azure.files, name: Azure Files, kind: data.file, hipaa: true, aliases: [azure files, smb, file share] }
