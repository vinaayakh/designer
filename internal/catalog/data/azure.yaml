# Azure Cloud Catalog, v1 (ticket 017). Same entry shape as aws.yaml.
# TODO before release: hipaa flags were written from memory and are UNVERIFIED (hipaa_as_of is null
# until checked against Microsoft's HIPAA/HITRUST in-scope services list).
provider: azure
display: Azure
group_names: { network: VNet, account: Azure subscription, zone: Availability Zone }
hipaa_as_of: null
icon_set: null

services:
