  - { id: azure.vm, name: Azure Virtual Machines, kind: compute.vm, hipaa: true, aliases: [vm, virtual machine, server] }
  - { id: azure.vmss, name: Azure Virtual Machine Scale Sets, kind: compute.vm, hipaa: true, aliases: [vmss, scale set] }
  - { id: azure.container-apps, name: Azure Container Apps, kind: compute.container, hipaa: true, aliases: [container apps, aca, containers] }
  - { id: azure.container-instances, name: Azure Container Instances, kind: compute.container, hipaa: true, aliases: [aci, container instances] }
  - { id: azure.aks, name: Azure Kubernetes Service (AKS), kind: compute.kubernetes, hipaa: true, aliases: [aks, kubernetes, k8s] }
  - { id: azure.functions, name: Azure Functions, kind: compute.function, hipaa: true, aliases: [functions, function app, serverless] }
  - { id: azure.app-service, name: Azure App Service, kind: compute.web-app, hipaa: true, aliases: [app service, web app] }
  - { id: azure.static-web-apps, name: Azure Static Web Apps, kind: compute.web-app, hipaa: false, aliases: [static web apps, spa hosting] }
  - { id: azure.batch, name: Azure Batch, kind: compute.batch, hipaa: true, aliases: [batch, jobs] }
  - { id: azure.data-factory, name: Azure Data Factory, kind: compute.batch, hipaa: true, aliases: [data factory, adf, etl] }
  - { id: azure.hdinsight, name: Azure HDInsight, kind: compute.batch, hipaa: true, aliases: [hdinsight, hadoop, spark] }
  - { id: azure.stream-analytics, name: Azure Stream Analytics, kind: compute.batch, hipaa: true, aliases: [stream analytics] }
