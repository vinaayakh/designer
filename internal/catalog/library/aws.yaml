# AWS Component Library (sim ticket 013). Not embedded yet.
#
# What the library panel shows for the AWS target: groups in display order, and the components in each.
# A component is a ready-to-place preset: a catalog Service (identity, Kind, HIPAA flag), an official
# icon, search keywords, and the defaults it is placed with. Everything the simulation needs comes
# from the Kind's Behaviour Profile plus the Service override; nothing here is AWS-specific code.
#
# icon: a key in the pinned AWS icon package (icons/aws.yaml). Arch_* = service icon,
#   Res_* = resource icon (a part of a service, e.g. an ALB), group icons are named as in the package.
#   Never bundled: downloaded on first use after the user agrees to AWS's terms (v1 ticket 014).
# sim: full (simulated from a Behaviour Profile) | hop (on the request path: adds latency and its
#   quota, no capacity of its own) | off-path (drawn, not in the request flow; dimmed in Sim Mode).
# place: node (default) | group (draws a Group) | source (a traffic source that starts Routes).
provider: aws
icons: aws                         # → icons/aws.yaml
groups:
  - { id: quick, title: Quick inserts, role: quick }
  - { id: sources, title: Traffic sources, role: sources, icon: Res_Users_48_Light }
  - { id: lb, title: Load balancing, role: load-balancing, icon: Arch_Elastic-Load-Balancing_64 }
  - { id: edge, title: Edge and APIs, role: edge, icon: Arch-Category_Networking-Content-Delivery_64 }
  - { id: compute, title: Compute, role: compute, icon: Arch-Category_Compute_64 }
  - { id: ecs, title: ECS, role: containers, icon: Arch_Amazon-Elastic-Container-Service_64 }
  - { id: eks, title: EKS, role: kubernetes, icon: Arch_Amazon-Elastic-Kubernetes-Service_64 }
  - { id: databases, title: Databases, role: databases, icon: Arch-Category_Databases_64 }
  - { id: caching, title: Caching, role: caching, icon: Arch_Amazon-ElastiCache_64 }
  - { id: messaging, title: Messaging and streaming, role: messaging, icon: Arch-Category_Application-Integration_64 }
  - { id: storage, title: Storage, role: storage, icon: Arch-Category_Storage_64 }
  - { id: network, title: Network, role: network, icon: Arch_Amazon-Virtual-Private-Cloud_64 }
  - { id: security, title: Security and identity, role: security, icon: Arch-Category_Security-Identity_64 }
  - { id: observability, title: Monitoring, role: observability, icon: Arch-Category_Management-Tools_64 }

# Quick inserts: one-drop changes with wiring rules (sim ticket 008, now part of the library).
quick:
  - { id: add-cache, title: Cache in front, component: aws.elasticache-valkey, onto: edge, into_kinds: [data.relational, data.document, data.key-value], rule: cache-aside }
  - { id: add-queue, title: Queue between, component: aws.sqs, onto: edge, rule: make-async }
  - { id: add-replica, title: Read replica, component: same, onto: node, kinds: [data.relational], rule: read-replica }
  - { id: add-lb, title: Load balancer in front, component: aws.alb, onto: node, rule: front }
  - { id: add-cdn, title: CDN in front, component: aws.cloudfront, onto: node, rule: front }
  - { id: add-breaker, title: Circuit breaker, onto: edge, rule: breaker }

components:
  # Traffic sources: where Routes start. Not catalog Services; they're `external` Kinds.
