  - { id: aws.nlb, group: lb, service: aws.nlb, icon: Res_Elastic-Load-Balancing_Network-Load-Balancer_48, sim: full, keywords: [nlb, tcp, udp, layer 4, l4, elb] }
  - { id: aws.gwlb, group: lb, service: aws.gwlb, icon: Res_Elastic-Load-Balancing_Gateway-Load-Balancer_48, sim: hop, keywords: [gwlb, appliance, firewall, inspection] }
  - { id: aws.global-accelerator, group: lb, service: aws.global-accelerator, icon: Arch_AWS-Global-Accelerator_64, sim: hop, keywords: [anycast, multi-region, failover] }

