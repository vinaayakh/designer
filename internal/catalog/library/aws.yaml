  - { id: aws.appsync, group: edge, service: aws.appsync, icon: Arch_AWS-AppSync_64, sim: hop, keywords: [graphql, api] }
  - { id: aws.route53, group: edge, service: aws.route53, icon: Arch_Amazon-Route-53_64, sim: off-path, keywords: [dns, domain, routing policy] }

