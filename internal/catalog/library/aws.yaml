  - { id: src.mobile, group: sources, kind: external.client, label: Mobile app, icon: Res_Mobile-client_48_Light, place: source, keywords: [ios, android, phone] }
  - { id: src.client, group: sources, kind: external.client, label: API client, icon: Res_Client_48_Light, place: source, keywords: [partner, integration, machine] }
  - { id: src.internet, group: sources, kind: external.client, label: Internet, icon: Res_Internet_48_Light, place: source, keywords: [public, www] }

  # Load balancing
