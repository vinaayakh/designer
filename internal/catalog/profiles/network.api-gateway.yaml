kind: network.api-gateway
as_of: 2026-10-15
unit: request
capacity:
  model: quota
  # Account-wide, per region: 10,000 requests/s steady with a burst of 5,000; some newer regions
  # default to 2,500. Over the limit: 429. Can be raised on request.
  rate_per_s: { low: 2500, typical: 10000, high: 10000 }
  burst: { low: 1250, typical: 5000, high: 5000 }
  confidence: vendor
latency:
  service_ms: { low: 5, typical: 15, high: 40 }    # estimate: auth, mapping, routing
  spread: 0.4
services:
  aws.api-gateway:
    price: { rest_per_million: 3.50, http_per_million: 1.00, region: us-east-1, as_of: 2026-10, verify: true }
sources:
  - { id: apigw-quotas, url: "https://docs.aws.amazon.com/apigateway/latest/developerguide/limits.html", copy: facts-only, used_for: [rate_per_s, burst] }
